version: '3.8'

services:

  db:
    image: postgres:15
    container_name: techstore-db

    environment:
      POSTGRES_DB: techstore
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d techstore"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: techstore-api

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

    restart: always